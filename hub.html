       info       공지사항 / 후기 / FAQ   (/daechisecret)
       mock       모의고사 자료           (/mock)
       textbook   교과서                  (/78)
       supplement 부교재                  (/supplement)
       special    수능대비/방학특강 자료   (/special-lecture)

     어느 대문인지만 적어 두고, 그리는 일은 여기서 합니다.
     data-hub 를 안 적으면 info 로 봅니다 (먼저 넣어 둔 코드와 어긋나지 않게).

     전에는 이미지 맵 한 장이었습니다. 그림이라 휴대폰에서 글자가 작아지고,
     검색엔진이 글을 못 읽고, 한 줄 고치려면 그림을 다시 만들어야 했습니다.

     info 대문의 공지와 후기는 **그 자리에서 사이트를 읽어** 채웁니다.
       공지 : /notice 게시판 목록 앞 4건
       후기 : /reviews 의 베스트 후기 카드에서 앞 2건
              (그 카드는 <template shadowrootmode> 안에 있어 template 속까지 뒤집니다)

     메뉴가 바뀌면 `python menu.py` 로 다시 뽑아 아래 표를 고칩니다.
     ═══════════════════════════════════════════════════════════════ -->
<div id="sl-hub">
<style>
#sl-hub{
  --pink:#e85a8a; --pink-d:#c33e6d; --pink-l:#fdeef3; --pink-b:#f2b8cd;
  --navy:#1d3a5e; --navy-l:#46617f; --gray:#93a5bd; --line:#e6ecf4;
  max-width:1240px; margin:0 auto; padding:0 20px 70px;
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; color:var(--navy);
  -webkit-font-smoothing:antialiased;
}
#sl-hub *{box-sizing:border-box}
#sl-hub a{text-decoration:none;color:inherit}
#sl-hub span,#sl-hub p,#sl-hub h1,#sl-hub h3,#sl-hub h4,#sl-hub li{font-family:inherit;letter-spacing:-.02em}
#sl-hub ul{list-style:none;margin:0;padding:0}

#sl-hub .hb-hd{text-align:center;padding:36px 0 30px}
#sl-hub .hb-eye{font-size:12.5px;font-weight:800;color:var(--pink);letter-spacing:.08em}
#sl-hub .hb-hd h1{margin:8px 0 10px;font-size:31px;font-weight:900;letter-spacing:-.045em;line-height:1.25}
#sl-hub .hb-hd p{margin:0;font-size:14.5px;color:var(--navy-l);line-height:1.7}

#sl-hub .hb-sec{display:flex;align-items:baseline;gap:10px;margin:38px 0 14px}
#sl-hub .hb-sec:first-of-type{margin-top:0}
#sl-hub .hb-sec h3{margin:0;font-size:16.5px;font-weight:800}
#sl-hub .hb-sec span{font-size:12.5px;color:var(--gray)}

/* ── 공지 + 후기 (info) ── */
#sl-hub .hb-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
#sl-hub .hb-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
#sl-hub .hb-cap{display:flex;align-items:center;gap:9px;margin-bottom:14px}
#sl-hub .hb-cap .ic{width:34px;height:34px;border-radius:10px;background:var(--pink-l);
  display:grid;place-items:center;font-size:17px;flex:none}
#sl-hub .hb-cap h3{margin:0;font-size:15.5px;font-weight:850;flex:1}
#sl-hub .hb-cap a{font-size:12px;color:var(--pink);font-weight:750;white-space:nowrap}
#sl-hub .hb-notice li{border-bottom:1px solid #f2f6fb}
#sl-hub .hb-notice li:last-child{border-bottom:0}
#sl-hub .hb-notice a,#sl-hub .hb-notice .row{display:flex;gap:9px;align-items:baseline;padding:8px 0;font-size:13px}
#sl-hub .hb-notice .tg{font-size:10.5px;font-weight:800;color:#fff;background:var(--pink);
  border-radius:5px;padding:2px 6px;flex:none;line-height:1.5}
#sl-hub .hb-notice .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sl-hub .hb-notice a:hover .tt{color:var(--pink-d);text-decoration:underline}
#sl-hub .hb-notice .dd{color:var(--gray);font-size:11.5px;flex:none}
#sl-hub .hb-rev{display:flex;flex-direction:column;gap:10px}
#sl-hub .hb-q{display:block;background:#fbfdff;border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:12.5px;line-height:1.65;color:var(--navy-l)}
#sl-hub .hb-q .st{color:#f5a623;font-size:12px;letter-spacing:1px}
#sl-hub .hb-q .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sl-hub .hb-q .who{font-size:11px;color:var(--gray);margin-top:5px}

/* ── 가로 단추 줄 ── */
#sl-hub .hb-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#sl-hub .hb-btn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;
  display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:13px;align-items:center;transition:.14s}
#sl-hub .hb-btn:hover{border-color:var(--pink-b);background:#fffafc;transform:translateY(-2px)}
#sl-hub .hb-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--pink-l);
  display:grid;place-items:center;font-size:18px}
#sl-hub .hb-btn h4{margin:0 0 2px;font-size:15px;font-weight:800}
#sl-hub .hb-btn p{margin:0;font-size:11.5px;color:var(--navy-l)}
#sl-hub .hb-btn .aw{color:var(--pink-b)}
#sl-hub .hb-bot.c4{grid-template-columns:repeat(4,1fr)}
#sl-hub .hb-bot.c2{grid-template-columns:repeat(2,1fr)}

/* ── 바깥 채널 ── */
#sl-hub .hb-links{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
#sl-hub .hb-link{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;transition:.14s}
#sl-hub .hb-link:hover{border-color:var(--pink-b);background:#fffafc;transform:translateY(-2px)}
#sl-hub .hb-link .mk{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;font-weight:900}
#sl-hub .hb-link h4{margin:0 0 3px;font-size:14px;font-weight:800}
#sl-hub .hb-link p{margin:0;font-size:11.5px;color:var(--navy-l);line-height:1.5}
#sl-hub .hb-link .ex{color:var(--gray);font-size:13px}
#sl-hub .hb-link .hot{font-size:10px;font-weight:800;color:#fff;background:var(--pink);
  border-radius:100px;padding:3px 8px;white-space:nowrap;line-height:1.4}

/* ── 학년/교재 큰 카드 (mock) ── */
#sl-hub .hb-big{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#sl-hub .hb-bcard{background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:26px 22px 22px;text-align:center;transition:.16s}
#sl-hub .hb-bcard:hover{transform:translateY(-3px);border-color:var(--pink-b);
  box-shadow:0 12px 26px rgba(232,90,138,.13)}
#sl-hub .hb-bcard .gr{font-size:12px;font-weight:800;color:var(--pink);letter-spacing:.05em}
#sl-hub .hb-bcard h4{margin:7px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.04em}
#sl-hub .hb-bcard p{margin:0;font-size:12.5px;color:var(--navy-l)}

/* ── 교재별 갈래 표 (textbook · supplement) ── */
#sl-hub .hb-grp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px}
#sl-hub .hb-grp > .ttl{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
#sl-hub .hb-grp > .ttl h4{margin:0;font-size:16px;font-weight:850}
#sl-hub .hb-grp > .ttl a{font-size:12px;color:var(--pink);font-weight:750}
#sl-hub .hb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#sl-hub .hb-col{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfdff}
#sl-hub .hb-col > a.bk{display:block;font-size:14px;font-weight:800;margin-bottom:9px}
#sl-hub .hb-col > a.bk:hover{color:var(--pink-d)}
#sl-hub .hb-pills{display:flex;flex-wrap:wrap;gap:6px}
#sl-hub .hb-pill{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:100px;
  padding:5px 11px;font-size:12px;font-weight:600;color:var(--navy-l);transition:.12s;white-space:nowrap}
#sl-hub .hb-pill:hover{border-color:var(--pink);background:var(--pink);color:#fff}

@media (max-width:1100px){ #sl-hub .hb-links,#sl-hub .hb-bot.c4{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  #sl-hub .hb-top,#sl-hub .hb-bot,#sl-hub .hb-bot.c4,#sl-hub .hb-bot.c2,
  #sl-hub .hb-big,#sl-hub .hb-cols{grid-template-columns:1fr}
  #sl-hub .hb-hd h1{font-size:25px}
}
</style>

      '<div class="hb-bot">' +
        btn({ic:'✉️', t:'문의 게시판',    d:'자료·수업 문의는 여기로',        u:'/contact'}) +
        btn({ic:'❓', t:'자주 묻는 질문',  d:'결제·다운로드·저작권 관련 안내',  u:'/faq'}) +
        btn({ic:'📄', t:'자료 샘플 확인',  d:'사기 전에 미리 훑어보세요',      u:'/sample'}) +
      '</div>';
  }

  function pills(items) {
    return '<div class="hb-pills">' + items.map(function (it) {
      return '<a class="hb-pill" href="' + esc(it[1]) + '">' + esc(it[0]) + '</a>';
    }).join('') + '</div>';
  }

  if (C.groups && C.groups.length) {
    html += C.groups.map(function (g) {
      var inner = g.cols
        ? '<div class="hb-cols">' + g.cols.map(function (c) {
            return '<div class="hb-col"><a class="bk" href="' + esc(c.u) + '">' + esc(c.t) + ' →</a>' +
              pills(c.items) + '</div>';
          }).join('') + '</div>'
        : pills(g.items || []);
      return '<div class="hb-grp"><div class="ttl"><h4>' + esc(g.t) + '</h4>' +
        '<a href="' + esc(g.u) + '">전체 보기 →</a></div>' + inner + '</div>';
    }).join('');
  }

  if (C.bot && C.bot.length) {
    var cls = C.bot.length === 4 ? 'c4' : (C.bot.length === 2 || C.bot.length === 1 ? 'c2' : '');
    html += '<div class="hb-bot ' + cls + '">' + C.bot.map(btn).join('') + '</div>';
  }

  html += '<div class="hb-sec"><h3>대치동시크릿 더 알아보기</h3><span>바깥 채널로 이어집니다</span></div>' +
    '<div class="hb-links">' + LINKS.map(function (c) {
      return '<a class="hb-link" href="' + esc(c.u) + '" target="_blank" rel="noopener">' +
        '<span class="mk" style="background:' + c.bg + ';color:' + c.fg + '">' + c.mk + '</span>' +
        '<span><h4>' + esc(c.t) + '</h4><p>' + esc(c.d) + '</p></span>' +
        (c.hot ? '<span class="hot">' + esc(c.hot) + '</span>' : '<span class="ex">↗</span>') + '</a>';
    }).join('') + '</div>';

  function btn(b) {
    return '<a class="hb-btn" href="' + esc(b.u) + '"><div class="ic">' + b.ic + '</div>' +
      '<div><h4>' + esc(b.t) + '</h4><p>' + esc(b.d) + '</p></div><div class="aw">→</div></a>';
  }

  box.innerHTML = html;

  /* ═══════════ info 대문만 : 공지·후기를 사이트에서 읽어 채웁니다 ═══════════ */
  if (WHICH !== 'info' || !window.fetch || !window.DOMParser) return;

  function get(u) {
    return fetch(u, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function (h) { return new DOMParser().parseFromString(h, 'text/html'); });
  }

  get('/notice').then(function (doc) {
    var wraps = doc.querySelectorAll('.widget.board._list_wrap .post_link_wrap');
    var out = [];
    for (var i = 0; i < wraps.length && out.length < 4; i++) {
      var w = wraps[i], a = w.querySelector('a.title_link');
      if (!a) continue;
      /* 제목 안에 '공지' 딱지 글자가 섞여 있어 떼어 냅니다 */
      var c = a.cloneNode(true), st = c.querySelectorAll('.sticker');
      for (var j = 0; j < st.length; j++) st[j].parentNode.removeChild(st[j]);
      var title = (c.textContent || '').replace(/\s+/g, ' ').trim();
      if (!title) continue;
      var t = w.querySelector('.time');
      out.push({ t: title, u: a.getAttribute('href') || '/notice',
                 d: t ? (t.textContent || '').trim() : '',
                 pin: !!w.querySelector('.sticker.notice') });
    }
    if (!out.length) return;
    document.getElementById('hb-notice').innerHTML = out.map(function (n) {
      return '<li><a href="' + esc(n.u) + '">' + (n.pin ? '<span class="tg">중요</span>' : '') +
        '<span class="tt">' + esc(n.t) + '</span><span class="dd">' + esc(n.d) + '</span></a></li>';
    }).join('');
  }).catch(function () {
    document.getElementById('hb-notice').innerHTML =
      '<li><a href="/notice"><span class="tt">공지사항 보러 가기 →</span></a></li>';
  });

  get('/reviews').then(function (doc) {
    /* 베스트 후기 카드는 <template shadowrootmode="open"> 안에 들어 있어
       보통 querySelector 로는 안 보입니다. template 속(.content)까지 뒤집니다. */
    var cards = doc.querySelectorAll('article.iw-card');
    if (!cards.length) {
      var tps = doc.querySelectorAll('template'), found = [];
      for (var k = 0; k < tps.length; k++) {
        var got = tps[k].content ? tps[k].content.querySelectorAll('article.iw-card') : [];
        for (var m = 0; m < got.length; m++) found.push(got[m]);
      }
      cards = found;
    }
    var out = [];
    for (var i = 0; i < cards.length && out.length < 2; i++) {
      var c = cards[i], b = c.querySelector('.iw-content'), n = c.querySelector('.iw-name');
      var tx = b ? (b.textContent || '').replace(/\s+/g, ' ').trim() : '';
      if (!tx) continue;
      out.push({ tx: tx, who: n ? (n.textContent || '').trim() : '',
                 star: parseInt(c.getAttribute('data-rating'), 10) || 5 });
    }
    if (!out.length) return;
    document.getElementById('hb-rev').innerHTML = out.map(function (r) {
      var s = ''; for (var k = 0; k < r.star; k++) s += '★';
      return '<a class="hb-q" href="/reviews"><div class="st">' + s + '</div>' +
        '<div class="tx">' + esc(r.tx) + '</div>' +
        (r.who ? '<div class="who">' + esc(r.who) + ' 선생님</div>' : '') + '</a>';
    }).join('');
  }).catch(function () {
    document.getElementById('hb-rev').innerHTML =
      '<a class="hb-q" href="/reviews"><div class="tx">후기 보러 가기 →</div></a>';
  });
})();
</script>
</div>
