<!-- ═══════════════════════════════════════════════════════════════
     대치동시크릿 대문(허브) 페이지 — 다섯 곳이 이 파일 하나를 같이 씁니다.

       info       공지사항 / 후기 / FAQ   (/daechisecret)
       mock       모의고사 자료           (/mock)
       textbook   교과서                  (/78)
       supplement 부교재                  (/supplement)
       special    수능대비/방학특강 자료   (/special-lecture)

     각 페이지의 코드 위젯은 <div id="sl-hub-mount" data-hub="mock"> 처럼
     어느 대문인지만 적어 두고, 그리는 일은 여기서 합니다.
     data-hub 를 안 적으면 info 로 봅니다 (먼저 넣어 둔 코드와 어긋나지 않게).

     전에는 이미지 맵 한 장이었습니다. 그림이라 휴대폰에서 글자가 작아지고,
     검색엔진이 글을 못 읽고, 한 줄 고치려면 그림을 다시 만들어야 했습니다.

     info 대문의 공지와 후기는 **그 자리에서 사이트를 읽어** 채웁니다.
       공지 : /notice 게시판 목록 앞 4건
       후기 : /reviews 의 베스트 후기 카드에서 앞 2건
              (그 카드는 <template shadowrootmode> 안에 있어 template 속까지 뒤집니다)

     메뉴가 바뀌면 `python menu.py` 로 다시 뽑아 아래 표를 고칩니다.
     ═══════════════════════════════════════════════════════════════ -->
<div id="sl-hub">
<style>
#sl-hub{
  --pink:#e85a8a; --pink-d:#c33e6d; --pink-l:#fdeef3; --pink-b:#f2b8cd;
  --navy:#1d3a5e; --navy-l:#46617f; --gray:#93a5bd; --line:#e6ecf4;
  max-width:1240px; margin:0 auto; padding:0 20px 70px;
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; color:var(--navy);
  -webkit-font-smoothing:antialiased;
}
#sl-hub *{box-sizing:border-box}
#sl-hub a{text-decoration:none;color:inherit}
#sl-hub span,#sl-hub p,#sl-hub h1,#sl-hub h3,#sl-hub h4,#sl-hub li{font-family:inherit;letter-spacing:-.02em}
#sl-hub ul{list-style:none;margin:0;padding:0}

#sl-hub .hb-hd{text-align:center;padding:36px 0 30px}
#sl-hub .hb-eye{font-size:12.5px;font-weight:800;color:var(--pink);letter-spacing:.08em}
#sl-hub .hb-hd h1{margin:8px 0 10px;font-size:31px;font-weight:900;letter-spacing:-.045em;line-height:1.25}
#sl-hub .hb-hd p{margin:0;font-size:14.5px;color:var(--navy-l);line-height:1.7}

#sl-hub .hb-sec{display:flex;align-items:baseline;gap:10px;margin:38px 0 14px}
#sl-hub .hb-sec:first-of-type{margin-top:0}
#sl-hub .hb-sec h3{margin:0;font-size:16.5px;font-weight:800}
#sl-hub .hb-sec span{font-size:12.5px;color:var(--gray)}

/* ── 공지 + 후기 (info) ── */
#sl-hub .hb-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
#sl-hub .hb-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
#sl-hub .hb-cap{display:flex;align-items:center;gap:9px;margin-bottom:14px}
#sl-hub .hb-cap .ic{width:34px;height:34px;border-radius:10px;background:var(--pink-l);
  display:grid;place-items:center;font-size:17px;flex:none}
#sl-hub .hb-cap h3{margin:0;font-size:15.5px;font-weight:850;flex:1}
#sl-hub .hb-cap a{font-size:12px;color:var(--pink);font-weight:750;white-space:nowrap}
#sl-hub .hb-notice li{border-bottom:1px solid #f2f6fb}
#sl-hub .hb-notice li:last-child{border-bottom:0}
#sl-hub .hb-notice a,#sl-hub .hb-notice .row{display:flex;gap:9px;align-items:baseline;padding:8px 0;font-size:13px}
#sl-hub .hb-notice .tg{font-size:10.5px;font-weight:800;color:#fff;background:var(--pink);
  border-radius:5px;padding:2px 6px;flex:none;line-height:1.5}
#sl-hub .hb-notice .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sl-hub .hb-notice a:hover .tt{color:var(--pink-d);text-decoration:underline}
#sl-hub .hb-notice .dd{color:var(--gray);font-size:11.5px;flex:none}
#sl-hub .hb-rev{display:flex;flex-direction:column;gap:10px}
#sl-hub .hb-q{display:block;background:#fbfdff;border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:12.5px;line-height:1.65;color:var(--navy-l)}
#sl-hub .hb-q .st{color:#f5a623;font-size:12px;letter-spacing:1px}
#sl-hub .hb-q .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#sl-hub .hb-q .who{font-size:11px;color:var(--gray);margin-top:5px}

/* ── 가로 단추 줄 ── */
#sl-hub .hb-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#sl-hub .hb-btn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;
  display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:13px;align-items:center;transition:.14s}
#sl-hub .hb-btn:hover{border-color:var(--pink-b);background:#fffafc;transform:translateY(-2px)}
#sl-hub .hb-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--pink-l);
  display:grid;place-items:center;font-size:18px}
#sl-hub .hb-btn h4{margin:0 0 2px;font-size:15px;font-weight:800}
#sl-hub .hb-btn p{margin:0;font-size:11.5px;color:var(--navy-l)}
#sl-hub .hb-btn .aw{color:var(--pink-b)}
#sl-hub .hb-bot.c4{grid-template-columns:repeat(4,1fr)}
#sl-hub .hb-bot.c2{grid-template-columns:repeat(2,1fr)}

/* ── 바깥 채널 ── */
#sl-hub .hb-links{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
#sl-hub .hb-link{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;transition:.14s}
#sl-hub .hb-link:hover{border-color:var(--pink-b);background:#fffafc;transform:translateY(-2px)}
#sl-hub .hb-link .mk{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;font-weight:900}
#sl-hub .hb-link h4{margin:0 0 3px;font-size:14px;font-weight:800}
#sl-hub .hb-link p{margin:0;font-size:11.5px;color:var(--navy-l);line-height:1.5}
#sl-hub .hb-link .ex{color:var(--gray);font-size:13px}
#sl-hub .hb-link .hot{font-size:10px;font-weight:800;color:#fff;background:var(--pink);
  border-radius:100px;padding:3px 8px;white-space:nowrap;line-height:1.4}

/* ── 학년/교재 큰 카드 (mock) ── */
#sl-hub .hb-big{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#sl-hub .hb-bcard{background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:26px 22px 22px;text-align:center;transition:.16s}
#sl-hub .hb-bcard:hover{transform:translateY(-3px);border-color:var(--pink-b);
  box-shadow:0 12px 26px rgba(232,90,138,.13)}
#sl-hub .hb-bcard .gr{font-size:12px;font-weight:800;color:var(--pink);letter-spacing:.05em}
#sl-hub .hb-bcard h4{margin:7px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.04em}
#sl-hub .hb-bcard p{margin:0;font-size:12.5px;color:var(--navy-l)}

/* ── 교재 × 자료 유형 표 ── */
#sl-hub .hb-grp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;overflow-x:auto}
#sl-hub table.hb-tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
#sl-hub .hb-tbl th,#sl-hub .hb-tbl td{padding:0;text-align:center}
#sl-hub .hb-tbl thead th{font-size:11.5px;font-weight:800;color:var(--navy-l);padding:0 0 9px;white-space:nowrap}
#sl-hub .hb-tbl thead th:first-child{text-align:left;padding-left:2px}
#sl-hub .hb-tbl tbody tr + tr td{border-top:1px solid #f4f7fb}
#sl-hub .hb-bk{display:block;text-align:left;font-size:13.5px;font-weight:800;
  padding:11px 14px 11px 2px;min-width:196px;line-height:1.4}
#sl-hub .hb-bk small{display:block;font-weight:600;font-size:11px;color:var(--gray);margin-bottom:2px}
#sl-hub .hb-bk em{font-style:normal;font-size:11px;font-weight:750;color:var(--pink);margin-left:5px}
#sl-hub a.hb-bk:hover{color:var(--pink-d)}
#sl-hub .hb-cell{display:block;margin:5px 3px;border-radius:10px;padding:10px 6px;
  font-size:11.5px;font-weight:750;transition:.14s;letter-spacing:-.02em;line-height:1.35}
#sl-hub a.hb-cell:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(29,58,94,.10)}
#sl-hub .hb-cell b{display:block;font-size:11px;opacity:.62;font-weight:800;margin-top:1px}
#sl-hub .hb-cell.none{background:#fafbfd;color:#c2ccd9;font-weight:600;font-size:11px}

@media (max-width:1100px){ #sl-hub .hb-links,#sl-hub .hb-bot.c4{grid-template-columns:1fr 1fr} }
@media (max-width:900px){
  /* 「1fr」 은 **내용이 큰 만큼 늘어납니다.** 그래서 카드가 575px 로 벌어져 잘렸습니다.
     minmax(0,1fr) 로 써야 「화면만큼만」 이 됩니다. */
  #sl-hub .hb-top,#sl-hub .hb-bot,#sl-hub .hb-bot.c4,#sl-hub .hb-bot.c2,
  #sl-hub .hb-big,#sl-hub .hb-cols{grid-template-columns:minmax(0,1fr)}
  #sl-hub .hb-hd h1{font-size:25px}
  /* 바깥 채널 카드가 900px 규칙에 빠져 있어 네 칸 그대로였습니다.
     그래서 「카카오톡 플러스친구」가 한 글자씩 세로로 쪼개졌습니다. */
  #sl-hub .hb-links{grid-template-columns:minmax(0,1fr) !important}
}

/* ── 휴대폰 (390px 기준) ── */
@media (max-width:520px){
  /* ⚠ 대문 카드가 575px 로 벌어져 오른쪽이 잘렸습니다.
     칸마다 「더 줄어도 된다(min-width:0)」 고 알려 줘야 화면 안에 들어옵니다. */
  #sl-hub,#sl-hub *{min-width:0}
  #sl-hub .hb-card,#sl-hub .hb-cap,#sl-hub .hb-notice,#sl-hub .hb-rev,
  #sl-hub .hb-q,#sl-hub .hb-btn,#sl-hub .hb-link{max-width:100%}
  #sl-hub .hb-notice li a{gap:6px}
  #sl-hub .hb-notice .tt{white-space:normal;word-break:keep-all;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #sl-hub .hb-cap h3{font-size:14.5px}
  #sl-hub{padding:0 2px}
  #sl-hub .hb-hd h1{font-size:21px;line-height:1.35}
  #sl-hub .hb-hd p{font-size:12.5px}
  /* 카드 안 여백을 줄여 글이 잘리지 않게 */
  #sl-hub .hb-card{padding:16px 14px}
  #sl-hub .hb-ch h3{font-size:14.5px}
  #sl-hub .hb-list a{padding:9px 0;gap:7px}
  #sl-hub .hb-list .tt{font-size:12.5px;white-space:normal}
  #sl-hub .hb-list .dd{font-size:10.5px;flex:none}
  #sl-hub .hb-q{padding:13px 14px;font-size:12.5px}
  #sl-hub .hb-q .tx{-webkit-line-clamp:3}
  #sl-hub .hb-btn{padding:15px 14px;gap:10px}
  #sl-hub .hb-btn h4{font-size:14px}
  #sl-hub .hb-btn p{font-size:11px}
  /* 바깥 채널 — 그림·글·화살표 세 칸을 유지하되 글이 줄어들 수 있게 */
  #sl-hub .hb-link{grid-template-columns:36px minmax(0,1fr) auto;padding:13px 14px;gap:10px}
  #sl-hub .hb-link h4{font-size:13px;white-space:normal;word-break:keep-all}
  #sl-hub .hb-link p{font-size:11px}
  #sl-hub .hb-link .hot{display:none}   /* 「가장 빠른 답변」 딱지가 글을 밀어냅니다 */
  /* 교재 × 유형 표는 옆으로 밀어 봅니다 */
  #sl-hub .hb-cols,#sl-hub .hb-table{overflow-x:auto}
}
/* ── 교과서 대문 시안 C(사장님 2026-11-11): 왼쪽 학년·과목 고르기 + 위 자료 종류 + 표지 목록 ── */
#sl-hub .tx-lay{display:grid;grid-template-columns:250px 1fr;gap:26px;margin-top:26px;align-items:start}

#sl-hub .tx-k.on{background:var(--navy);color:#fff}
#sl-hub .tx-cnt{font-size:12px;color:var(--gray);margin:6px 0 4px;text-align:right}
#sl-hub .tx-gh{font-size:15px;font-weight:800;color:var(--navy);margin:22px 0 2px;padding-bottom:8px;border-bottom:2px solid var(--navy);display:flex;gap:8px;align-items:center}

#sl-hub .tx-row{display:grid;grid-template-columns:72px minmax(0,1fr) 250px 100px;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}

#sl-hub .tx-row h3{font-size:16px;font-weight:800;margin:0;color:var(--navy)}
#sl-hub .tx-row h3 a{color:inherit;text-decoration:none}
#sl-hub .tx-row .pt{font-size:14px;font-weight:700;color:var(--pink-d);margin-top:3px}
#sl-hub .tx-row .sb{font-size:12px;color:var(--gray);margin-top:3px}
#sl-hub .tx-row .ls{font-size:12px;color:var(--navy-l);margin-top:5px;line-height:1.6}
#sl-hub .tx-row .ls span{display:inline-block;margin-right:10px}
#sl-hub .tx-row .ls b{color:var(--gray);font-weight:600;margin-right:3px}
#sl-hub .tx-ps{display:flex;flex-wrap:wrap;gap:4px}
#sl-hub .tx-p{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;text-decoration:none;white-space:nowrap}
#sl-hub .tx-p b{margin-left:3px}
#sl-hub .tx-go{display:block;text-align:center;font-size:13px;font-weight:800;padding:9px 0;border-radius:999px;background:var(--pink);color:#fff;text-decoration:none}
#sl-hub .tx-go:hover{background:var(--pink-d)}
#sl-hub .tx-none{padding:40px 0;text-align:center;color:var(--gray)}
@media (max-width:900px){
  #sl-hub .tx-lay{grid-template-columns:1fr}
  #sl-hub .tx-side{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;white-space:nowrap}
  #sl-hub .tx-side h4{display:none}
  #sl-hub .tx-it{width:auto;flex:none;border-radius:999px;background:#f3f5f9}
  #sl-hub .tx-it i{margin-left:6px}
  #sl-hub .tx-row{grid-template-columns:64px minmax(0,1fr);gap:12px}
  #sl-hub .tx-cv,#sl-hub .tx-fake{width:64px;height:88px}
  #sl-hub .tx-ps,#sl-hub .tx-go{grid-column:1 / -1}
}
</style>
<div id="sl-hub-body"></div>
</div>

<script>

        return '<h4>' + lv + ' 교과서</h4>' + groups.filter(function (g) { return g.lv === lv; }).map(function (g) {
          return '<button type="button" class="tx-it" data-g="' + esc(g.g) + '"><span>' + esc(g.g) +
            (lv === '중등' ? ' 교과서<span class="nw">NEW</span>' : '') + '</span><i>' + count(g.g) + '</i></button>';
        }).join('');
      }).join('') +
      '</div><div><div class="tx-bar"><input class="tx-q" type="search" placeholder="교재 · 문법 포인트로 찾기 (예: 현재완료, 공통영어 2)">' +
      KINDS.map(function (k) { return '<button type="button" class="tx-k' + (k === '전체' ? ' on' : '') + '" data-k="' + esc(k) + '">' + esc(k) + '</button>'; }).join('') +
      '</div><div class="tx-cnt"></div><div class="tx-list"></div></div></div>';
    setTimeout(function () {
      var root = document.getElementById('sl-hub-body'); if (!root) return;
      var list = root.querySelector('.tx-list'), cnt = root.querySelector('.tx-cnt');
      function rowHtml(r) {
        var cv = r.cover ? '<img class="tx-cv" loading="lazy" src="' + esc(r.cover) + '" alt="' + esc(r.title) + '">'
                         : '<div class="tx-fake">' + esc(r.title) + '</div>';
        return '<div class="tx-row"><a href="' + esc(r.u) + '">' + cv + '</a><div>' +
          '<h3><a href="' + esc(r.u) + '">' + esc(r.title) + '</a></h3>' +
          (r.pt ? '<div class="pt">' + esc(r.pt) + '</div>' : '') +
          '<div class="sb">' + esc(r.sb) + '</div>' +
          (r.ls.length ? '<div class="ls">' + r.ls.map(function (l) { return '<span><b>' + esc(String(+l[0])) + '과</b>' + esc(pt2(l[1])) + '</span>'; }).join('') + '</div>' : '') +
          '</div><div class="tx-ps">' + r.pills.map(function (p) {
            var t = p.t || ['#eef2f8', '#46617f'];
            return '<a class="tx-p" style="background:' + t[0] + ';color:' + t[1] + '" href="' + esc(p.u) + '">' + esc(p.k) + '<b>' + p.n + '</b></a>';
          }).join('') + '</div><a class="tx-go" href="' + esc(r.u) + '">자료 보기</a></div>';
      }
      function draw() {
        var q = st.q.trim().toLowerCase(), out = '', shown = 0;
        groups.forEach(function (g) {
          if (st.g && st.g !== g.g) return;
          var rs = rowsTx.filter(function (r) { return r.g === g.g && (st.k === '전체' || r.tags[st.k]) && (!q || r.q.indexOf(q) >= 0); });
          if (!rs.length) return;
          shown += rs.length;
          out += '<div class="tx-gh">' + esc(g.g) + (g.lv === '중등' ? ' 교과서 <span class="nw">NEW</span>' : '') + '</div>' + rs.map(rowHtml).join('');
        });
        list.innerHTML = out || '<div class="tx-none">맞는 교재가 없어요. 다른 말로 찾아 보세요.</div>';
        cnt.textContent = '교재 ' + shown + '종';
      }
      root.querySelectorAll('.tx-it').forEach(function (b) { b.addEventListener('click', function () {
        root.querySelectorAll('.tx-it').forEach(function (x) { x.classList.toggle('on', x === b); });
        st.g = b.getAttribute('data-g'); draw(); }); });
      root.querySelectorAll('.tx-k').forEach(function (b) { b.addEventListener('click', function () {
        root.querySelectorAll('.tx-k').forEach(function (x) { x.classList.toggle('on', x === b); });
        st.k = b.getAttribute('data-k'); draw(); }); });
      root.querySelector('.tx-q').addEventListener('input', function (e) { st.q = e.target.value; draw(); });
      draw();
    }, 0);
  } else if (C.lines && C.lines.length) {
    var cols = C.cols || [];
    /* 아무 줄에도 없는 유형은 칸을 비워 두지 않고 아예 뺍니다 */
    cols = cols.filter(function (k) {
      for (var i = 0; i < C.lines.length; i++) if ((C.lines[i].cells || {})[k]) return true;
      return false;
    });
    html += '<div class="hb-grp"><table class="hb-tbl"><thead><tr><th>교재</th>' +
      cols.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      C.lines.map(function (r) {
        var nm = (r.p ? '<small>' + esc(r.p) + '</small>' : '') + esc(r.t) +
                 (r.u && r.n ? '<em>' + r.n + '개</em>' : '');
        var head = r.u
          ? '<a class="hb-bk" href="' + esc(r.u) + '">' + nm + '</a>'
          : '<span class="hb-bk">' + nm + '</span>';
        return '<tr><td>' + head + '</td>' + cols.map(function (k) {
          var c = (r.cells || {})[k];
          /* 게시판이 없거나 비어 있으면 「작업 중」 */
          if (!c || !c.n) return '<td><span class="hb-cell none">작업 중</span></td>';
          var t = tone(k);
          return '<td><a class="hb-cell" style="background:' + t[0] + ';color:' + t[1] + '" href="' +
            esc(c.u) + '">' + esc(k.replace(/ \((.+)\)/, '·$1')) + '<b>' + c.n + '</b></a></td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  if (C.bot && C.bot.length) {
    var cls = C.bot.length === 4 ? 'c4' : (C.bot.length === 2 || C.bot.length === 1 ? 'c2' : '');
    html += '<div class="hb-bot ' + cls + '">' + C.bot.map(btn).join('') + '</div>';
  }

  html += '<div class="hb-sec"><h3>대치동시크릿 더 알아보기</h3><span>외부 채널로 이어집니다</span></div>' +
    '<div class="hb-links">' + LINKS.map(function (c) {
      return '<a class="hb-link" href="' + esc(c.u) + '" target="_blank" rel="noopener">' +
        '<span class="mk" style="background:' + c.bg + ';color:' + c.fg + '">' + c.mk + '</span>' +
        '<span><h4>' + esc(c.t) + '</h4><p>' + esc(c.d) + '</p></span>' +
        (c.hot ? '<span class="hot">' + esc(c.hot) + '</span>' : '<span class="ex">↗</span>') + '</a>';
    }).join('') + '</div>';

  function btn(b) {
    var sub = (b.d !== undefined) ? b.d : (b.n ? '자료 ' + b.n + '개' : '준비 중');
    return '<a class="hb-btn" href="' + esc(b.u) + '"><div class="ic">' + b.ic + '</div>' +
      '<div><h4>' + esc(b.t) + '</h4><p>' + esc(sub) + '</p></div><div class="aw">→</div></a>';
  }

  box.innerHTML = html;

  /* ═══════════ info 대문만 : 공지·후기를 사이트에서 읽어 채웁니다 ═══════════ */
  if (WHICH !== 'info' || !window.fetch || !window.DOMParser) return;

  function get(u) {
    return fetch(u, { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function (h) { return new DOMParser().parseFromString(h, 'text/html'); });
  }

  get('/notice').then(function (doc) {
    var wraps = doc.querySelectorAll('.widget.board._list_wrap .post_link_wrap');
    var out = [];
    for (var i = 0; i < wraps.length && out.length < 4; i++) {
      var w = wraps[i], a = w.querySelector('a.title_link');
      if (!a) continue;
      /* 제목 안에 '공지' 딱지 글자가 섞여 있어 떼어 냅니다 */
      var c = a.cloneNode(true), st = c.querySelectorAll('.sticker');
      for (var j = 0; j < st.length; j++) st[j].parentNode.removeChild(st[j]);
      var title = (c.textContent || '').replace(/\s+/g, ' ').trim();
      if (!title) continue;
      var t = w.querySelector('.time');
      out.push({ t: title, u: a.getAttribute('href') || '/notice',
                 d: t ? (t.textContent || '').trim() : '',
                 pin: !!w.querySelector('.sticker.notice') });
    }
    if (!out.length) return;
    document.getElementById('hb-notice').innerHTML = out.map(function (n) {
      return '<li><a href="' + esc(n.u) + '">' + (n.pin ? '<span class="tg">중요</span>' : '') +
        '<span class="tt">' + esc(n.t) + '</span><span class="dd">' + esc(n.d) + '</span></a></li>';
    }).join('');
  }).catch(function () {
    document.getElementById('hb-notice').innerHTML =
      '<li><a href="/notice"><span class="tt">공지사항 보러 가기 →</span></a></li>';
  });

  /* ── 후기 ──
     예전에는 /reviews 페이지를 통째로 받아(66KB) 그 안에서 후기 카드를 찾았습니다.
     그런데 그 카드는 **우리 스크립트가 화면에서 만들어 내는 것**이라
     받아 온 글자 안에는 아예 없습니다. 그래서 늘 빈손으로 돌아왔고,
     「후기를 불러오는 중입니다…」가 사라지지 않았습니다.

     지금은 베스트 후기를 담아 둔 작은 파일(3KB)을 바로 읽습니다. */
  fetch('https://daechisecret.github.io/imweb-assets/reviews-best.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (list) {
      var box = document.getElementById('hb-rev');
      if (!box) return;
      if (!list || !list.length) throw new Error('빈 목록');
      /* 볼 때마다 다른 후기가 보이도록 앞에서 두 개를 골라 옵니다 */
      var out = list.slice(0, 2);
      box.innerHTML = out.map(function (r) {
        var s = '';
        for (var k = 0; k < (r.star || 5); k++) s += '♥';
        var tx = String(r.text || '');
        if (tx.length > 110) tx = tx.slice(0, 110) + '…';
        return '<a class="hb-q" href="/reviews"><div class="st">' + s + '</div>' +
          '<div class="tx">' + esc(tx) + '</div>' +
          (r.who ? '<div class="who">' + esc(r.who) + ' ' + esc(r.role || '선생님') + '</div>' : '') +
          '</a>';
      }).join('');
    })
    .catch(function () {
      var box = document.getElementById('hb-rev');
      if (box) box.innerHTML =
        '<a class="hb-q" href="/reviews"><div class="tx">후기 보러 가기 →</div></a>';
    });

})();
</script>
</div>
